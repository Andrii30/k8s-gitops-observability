apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cluster-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {
      "title": "Cluster Overview",
      "panels": [
        {
          "type": "stat",
          "title": "Targets Up",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(up)", "refId": "A" }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
