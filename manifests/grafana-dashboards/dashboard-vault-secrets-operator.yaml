apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-vault-secrets-operator
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  vault-secrets-operator.json: |
    {
      "title": "Vault Secrets Operator",
      "panels": [
        {
          "type": "stat",
          "title": "Reconciles / min (by controller)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum by (controller) (rate(controller_runtime_reconcile_total[5m]))", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Reconcile Errors / min (by controller)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum by (controller) (rate(controller_runtime_reconcile_total{result=\"error\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "type": "graph",
          "title": "Reconcile Duration p99 (by controller)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le, controller) (rate(controller_runtime_reconcile_time_seconds_bucket[5m])))", "refId": "A" }
          ]
        },
        {
          "type": "graph",
          "title": "Workqueue Depth (by controller)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "sum by (name) (workqueue_depth{name=~\"vault.*|hcp.*|secrettransformation\"})", "refId": "A" }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
